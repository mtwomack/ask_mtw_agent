[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ask_mtw_agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "google-adk[a2a]==2.12.0",
    "litellm>=1.84",
    "adk-database-memory[postgres]>=0.1.0",
    "asyncpg>=0.32.0",
    "tzdata>=2026.5",
    "matplotlib>=3.11.2",
    "openpyxl>=3.1.5",
    "python-pptx>=1.0.2",
    "pypdf>=6.21.1",
    "python-docx>=1.2.0",
]

[tool.setuptools]
packages = ["ask_mtw_agent"]
package-dir = { ask_mtw_agent = "." }

[tool.uv.sources]
google-adk = { git = "https://github.com/google/adk-python.git", rev = "main" }
