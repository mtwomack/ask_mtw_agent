[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ask_mtw_agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "google-adk[a2a]==2.12.0",
    "litellm>=1.84",
    "adk-database-memory[postgres]>=0.1.0",
    "asyncpg>=0.32.0",
]

[tool.setuptools]
packages = ["ask_mtw_agent"]
package-dir = { ask_mtw_agent = "." }

[tool.uv.sources]
google-adk = { git = "https://github.com/google/adk-python.git", rev = "main" }
